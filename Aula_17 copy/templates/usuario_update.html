<!-- templates/usuario_update.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atualizar Usuário</title>
</head>
<body>
    <h1>Atualizar Usuário</h1>

    <form method="post" action="/usuario/{{ usuario.usuario_id }}?_method=PUT">
        <label>Nome:</label><br>
        <input type="text" name="nome" value="{{ usuario.nome }}"><br><br>

        <label>E-mail:</label><br>
        <input type="email" name="email" value="{{ usuario.email }}"><br><br>

        <label>Senha (nova):</label><br>
        <input type="password" name="senha"><br><br>

        <label>Ativado:</label>
        <input type="checkbox" name="ativado" {% if usuario.ativado %}checked{% endif %}><br><br>

        <button type="submit">Salvar</button>
    </form>
</body>
</html>
