<!-- templates/usuario_detalhe.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Usuário</title>
</head>
<body>
    <h1>Detalhes do Usuário</h1>
    <ul>
        <li><strong>ID:</strong> {{ usuario.usuario_id }}</li>
        <li><strong>Nome:</strong> {{ usuario.nome }}</li>
        <li><strong>E-mail:</strong> {{ usuario.email }}</li>
        <li><strong>Ativo:</strong> {{ 'Sim' if usuario.ativado else 'Não' }}</li>
    </ul>
</body>
</html>
