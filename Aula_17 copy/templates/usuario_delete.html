<!-- templates/usuario_delete.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Excluir Usuário</title>
</head>
<body>
    <h1>Excluir Usuário</h1>

    <p>Tem certeza que deseja excluir o usuário <strong>{{ usuario.nome }}</strong>?</p>

    <form method="post" action="/usuario/{{ usuario.usuario_id }}?_method=DELETE">
        <button type="submit">Confirmar Exclusão</button>
    </form>

    <a href="/usuario/usuarios">Cancelar</a>
</body>
</html>
