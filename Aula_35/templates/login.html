{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Entrar</h2>

{% if erro %}
<p style="color:red;">{{ erro }}</p>
{% endif %}

<form method="post" action="/login">
    <label>CPF:</label><br>
    <input type="text" cpf="cpf" required><br><br>
    <label>Senha:</label><br>
    <input type="password" senha="senha" required><br><br>
    <button type="submit">Entrar</button>
</form>
{% endblock %}
